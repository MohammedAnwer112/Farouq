
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاروق الزركاني للتبريد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--gold2:#f3d98b;--bg:#080b14;--panel:#121a2e;--panel2:#0d1424;--ink:#f4ecd6;--mut:#9aa3b8;--line:#2b3654;--font:'Cairo',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);min-height:100vh;background:radial-gradient(circle at 15% 0,#1a2444 0,transparent 45%),radial-gradient(circle at 90% 100%,#2a1f08 0,transparent 40%),var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:linear-gradient(135deg,#f3d98b,#c9a227);color:#1a1405;font-weight:700;transition:filter .15s}
button:hover{filter:brightness(1.1)}
button.alt{background:linear-gradient(135deg,#fff1c1,#e6c45a)}
button.ghost{background:transparent;color:var(--gold2);border:1.5px solid var(--gold)}
button.ghost:hover{background:#d4af3722}
button.danger{background:#6e1d2a;color:#ffd9de}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink)}
input::placeholder{color:#6b7590}
input:focus{border-color:var(--gold)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;color:var(--mut)}

#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;background:radial-gradient(circle at 50% 30%,#1c2750 0,transparent 55%),var(--bg)}
.login-card{width:min(410px,100%);background:linear-gradient(180deg,#16203a,#0e1526);border:1px solid var(--gold);border-radius:22px;padding:30px 26px;text-align:center;box-shadow:0 0 0 6px #d4af3714,0 24px 70px #000a}
.login-card svg{color:var(--gold)}
.login-card h1{font-size:28px;margin:8px 0 2px;background:linear-gradient(135deg,#fff1c1,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-card p{margin:0 0 18px;color:var(--mut);font-size:14px}
.login-card input{text-align:center;letter-spacing:8px;font-size:22px;margin-bottom:12px}
.login-card button{width:100%;padding:12px}
#lerr{color:#ff8a8a;min-height:20px;font-size:14px;margin-top:8px;font-weight:600}

#app{display:none;max-width:1300px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#16203a,#101830);border:1px solid var(--line);border-bottom:2px solid var(--gold);border-radius:16px;padding:10px 18px;margin-bottom:16px}
header.top .logo{width:70px;color:var(--gold)}
header.top h2{margin:0;font-size:25px;flex:1;background:linear-gradient(135deg,#fff1c1,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr 360px;gap:16px;align-items:start}
@media(max-width:1150px){.grid{grid-template-columns:1fr 1fr}.rcol{grid-column:1/-1}}
@media(max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px;color:var(--gold2);padding-bottom:6px;border-bottom:1px solid var(--gold);display:block}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.row.three{grid-template-columns:2fr 1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:13px;display:flex;gap:8px;align-items:center}
.chip b{color:var(--gold2)}
.chip span{cursor:pointer}
.chip button{padding:0 6px;background:transparent;color:#ff8a8a;font-size:17px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#1c2742;color:var(--gold2);padding:8px 6px;text-align:right;font-weight:600}
table.t td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t input{padding:5px 6px;width:80px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:19px;margin-top:12px;padding:12px 14px;background:linear-gradient(135deg,#f3d98b,#c9a227);color:#1a1405;border-radius:12px}
.empty{color:var(--mut);text-align:center;padding:16px;font-size:14px}
.hist{max-height:340px;overflow:auto}
.h-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.h-item small{color:var(--mut);display:block}
.h-item button{padding:5px 10px;font-size:12px;margin-inline-start:3px}
.paper-sw{display:flex;gap:8px;margin-bottom:12px}
.paper-sw button{flex:1;background:transparent;border:1.5px solid var(--gold);color:var(--gold2)}
.paper-sw button.on{background:linear-gradient(135deg,#f3d98b,#c9a227);color:#1a1405}
.pv{background:#2a3350;border-radius:12px;padding:14px;overflow:auto;display:flex;justify-content:center}

#receipt{background:#fff;color:#000;width:58mm;padding:3mm;font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:11px;line-height:1.45;direction:rtl;font-weight:600}
#receipt.p80{width:80mm;font-size:13px}
#receipt .c{text-align:center}
#receipt h1{font-size:1.5em;margin:2px 0;font-weight:800}
#receipt .logo{width:46px;display:block;margin:0 auto}
#receipt hr{border:0;border-top:1.5px dashed #000;margin:5px 0}
#receipt table{width:100%;border-collapse:collapse}
#receipt th{text-align:right;border-bottom:1.5px solid #000;font-size:.95em}
#receipt td{padding:2px 0;vertical-align:top}
#receipt .n{text-align:left;white-space:nowrap}
#receipt .sum{display:flex;justify-content:space-between}
#receipt .grand{font-size:1.35em;font-weight:800;border-top:2px solid #000;border-bottom:2px solid #000;padding:3px 0;margin-top:4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1405;font-weight:700;padding:10px 22px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
#printzone{display:none}
@media print{
 html,body{background:#fff!important;margin:0!important;padding:0!important}
 body>*:not(#printzone):not(#defs){display:none!important}
 #printzone{display:block!important}
 #printzone #receipt{width:48mm;padding:0 0 4mm;margin:0 auto;color:#000;font-weight:700;font-size:11px}
 #printzone #receipt.p80{width:72mm;font-size:13px}
 #printzone #receipt *{color:#000!important;background:transparent!important}
}
</style>
<style id="pg">@page{size:58mm auto;margin:0}</style>
</head>
<body>

<!-- LOGO SYMBOL: سيارة + ندفة ثلج -->
<svg id="defs" width="0" height="0" style="position:absolute"><defs>
<symbol id="car" viewBox="0 0 200 110">
 <path d="M12 74c0-10 4-16 14-18l22-6 22-22c4-4 8-6 14-6h46c8 0 14 3 20 10l16 18 18 4c8 2 12 8 12 16v6c0 4-3 6-6 6H18c-4 0-6-3-6-8z" fill="currentColor"/>
 <path d="M64 30h34v22H52zM106 30h26l18 22h-44z" fill="#fff" opacity=".85"/>
 <circle cx="56" cy="86" r="16" fill="#222"/><circle cx="56" cy="86" r="7" fill="#ddd"/>
 <circle cx="152" cy="86" r="16" fill="#222"/><circle cx="152" cy="86" r="7" fill="#ddd"/>
 <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="translate(30 12)"><path d="M0-9v18M-8-4.5l16 9M-8 4.5l16-9"/></g>
</symbol></defs></svg>

<div id="login">
 <div class="login-card">
  <svg width="170" height="94" ><use href="#car"/></svg>
  <h1>فاروق الزركاني للتبريد</h1>
  <p>أدخل كلمة السر للدخول</p>
  <input id="pw" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
  <button onclick="doLogin()">دخول</button>
  <div id="lerr"></div>
 </div>
</div>

<div id="app">
 <header class="top">
  <svg class="logo" viewBox="0 0 200 110" ><use href="#car"/></svg>
  <h2>فاروق الزركاني للتبريد</h2>
  <div class="tools">
   <button class="ghost" onclick="exportJSON()">نسخة احتياطية</button>
   <button class="ghost" onclick="document.getElementById('imp').click()">استيراد</button>
   <input type="file" id="imp" accept=".json,application/json" hidden onchange="importJSON(this)">
   <button class="danger" onclick="logout()">خروج</button>
  </div>
 </header>

 <div class="grid">
  <div>
   <div class="card">
    <h3>إضافة منتج</h3>
    <div class="row three">
     <div><label>اسم المنتج</label><input id="pname" placeholder="مثال: رادتير"></div>
     <div><label>السعر</label><input id="pprice" type="number" min="0" inputmode="decimal"></div>
     <div><label>الكمية</label><input id="pqty" type="number" min="1" value="1" inputmode="numeric"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
     <button class="alt" onclick="addToCart()">إضافة إلى السلة</button>
     <button class="ghost" onclick="saveProduct()">حفظ في قائمة المنتجات</button>
    </div>
    <div class="chips" id="plist"></div>
   </div>
   <div class="card">
    <h3>سجل الطلبات</h3>
    <input id="hq" placeholder="بحث بالاسم أو الهاتف أو الرقم" oninput="renderHist()" style="margin:8px 0">
    <div class="hist" id="hist"></div>
   </div>
  </div>

  <div>
   <div class="card">
    <h3>معلومات الطلب</h3>
    <div class="row">
     <div><label>اسم الزبون</label><input id="cname" oninput="upd()"></div>
     <div><label>رقم الهاتف</label><input id="cphone" inputmode="tel" oninput="upd()"></div>
    </div>
    <div class="row">
     <div><label>تاريخ الشراء</label><input id="cdate" type="date" oninput="upd()"></div>
     <div><label>الخصم</label><input id="cdisc" type="number" min="0" value="0" oninput="upd()"></div>
    </div>
    <label>ملاحظة</label><input id="cnote" oninput="upd()">
   </div>
   <div class="card">
    <h3>السلة</h3>
    <div id="cart"></div>
    <div class="tot"><span>الإجمالي</span><span id="gt">0</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
     <button onclick="saveAndPrint()">حفظ وطباعة</button>
     <button class="ghost" onclick="saveOrder(true)">حفظ فقط</button>
     <button class="danger" onclick="newOrder()">طلب جديد</button>
    </div>
   </div>
  </div>

  <div class="rcol">
   <div class="card">
    <h3>معاينة الوصل</h3>
    <div class="paper-sw" style="margin-top:8px">
     <button id="b58" onclick="setSet('paper','58')">58 ملم</button>
     <button id="b80" onclick="setSet('paper','80')">80 ملم</button>
    </div>
    <div class="pv"><div id="receipt"></div></div>
    <button style="width:100%;margin-top:10px" onclick="printNow()">طباعة الوصل</button>
   </div>
  </div>
 </div>
</div>

<div id="printzone"></div>
<div id="toast"></div>

<script>
const KEY='zargani_receipt_v1', PASS='2009', TITLE='فاروق الزركاني للتبريد', CUR='د.ع';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=n=>(Number(n)||0).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={products:[],cart:[],cust:{name:'',phone:'',date:today(),disc:0,note:''},history:[],counter:1,set:{paper:'58'},view:null};

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S={...S,...d,set:{...S.set,...(d.set||{})},view:null}}}catch(e){}}
function save(){try{const{view,...rest}=S;localStorage.setItem(KEY,JSON.stringify(rest))}catch(e){toast('تعذر الحفظ التلقائي')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

/* login */
function doLogin(){
 if($('pw').value===PASS){try{sessionStorage.setItem('zl','1')}catch(e){}enter()}
 else{$('lerr').textContent='كلمة السر غير صحيحة';$('pw').value='';$('pw').focus()}
}
function enter(){$('login').style.display='none';$('app').style.display='block';init()}
function logout(){try{sessionStorage.removeItem('zl')}catch(e){}location.reload()}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* settings */
function setSet(k,v){S.set[k]=v;applySet();save()}
function applySet(){
 $('b58').classList.toggle('on',S.set.paper==='58');$('b80').classList.toggle('on',S.set.paper==='80');
 $('pg').textContent=`@page{size:${S.set.paper}mm auto;margin:0}`;
 renderReceipt();
}

/* products & cart */
function saveProduct(){
 const name=$('pname').value.trim(),price=+$('pprice').value;
 if(!name||!(price>=0)||$('pprice').value===''){return toast('أدخل اسم المنتج وسعره')}
 const ex=S.products.find(p=>p.name===name);
 if(ex)ex.price=price;else S.products.push({name,price});
 save();renderProducts();toast('تم حفظ المنتج')
}
function addToCart(){
 const name=$('pname').value.trim(),price=+$('pprice').value,qty=Math.max(1,+$('pqty').value||1);
 if(!name||$('pprice').value===''||!(price>=0))return toast('أدخل اسم المنتج وسعره');
 const ex=S.cart.find(i=>i.name===name&&i.price===price);
 if(ex)ex.qty+=qty;else S.cart.push({name,price,qty});
 $('pname').value='';$('pprice').value='';$('pqty').value=1;$('pname').focus();
 S.view=null;upd(true)
}
function quickAdd(i){const p=S.products[i];const ex=S.cart.find(c=>c.name===p.name&&c.price===p.price);
 if(ex)ex.qty++;else S.cart.push({name:p.name,price:p.price,qty:1});S.view=null;upd(true)}
function fillProduct(i){const p=S.products[i];$('pname').value=p.name;$('pprice').value=p.price;$('pqty').focus()}
function delProduct(i){S.products.splice(i,1);save();renderProducts()}
function renderProducts(){
 $('plist').innerHTML=S.products.length?S.products.map((p,i)=>`<div class="chip"><span onclick="quickAdd(${i})" title="إضافة للسلة">${esc(p.name)} <b>${fmt(p.price)}</b></span><span onclick="fillProduct(${i})" title="تعديل">✎</span><button onclick="delProduct(${i})" title="حذف">×</button></div>`).join(''):'<div class="empty">لا توجد منتجات محفوظة. اضغط على المنتج لإضافته للسلة بسرعة.</div>'
}
function setQty(i,v){S.cart[i].qty=Math.max(1,+v||1);S.view=null;upd(true,true)}
function setPrice(i,v){S.cart[i].price=Math.max(0,+v||0);S.view=null;upd(true,true)}
function delItem(i){S.cart.splice(i,1);S.view=null;upd(true)}
function renderCart(){
 $('cart').innerHTML=S.cart.length?`<table class="t"><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>المجموع</th><th></th></tr>${S.cart.map((c,i)=>`<tr><td>${esc(c.name)}</td><td><input type="number" min="0" value="${c.price}" onchange="setPrice(${i},this.value)"></td><td><input type="number" min="1" value="${c.qty}" onchange="setQty(${i},this.value)"></td><td>${fmt(c.price*c.qty)}</td><td><button class="danger" style="padding:3px 9px" onclick="delItem(${i})">×</button></td></tr>`).join('')}</table>`:'<div class="empty">السلة فارغة. أضف منتجاً للبدء.</div>'
}
const sub=items=>items.reduce((s,i)=>s+i.price*i.qty,0);

/* customer */
function readCust(){S.cust={name:$('cname').value,phone:$('cphone').value,date:$('cdate').value||today(),disc:+$('cdisc').value||0,note:$('cnote').value}}
function writeCust(){const c=S.cust;$('cname').value=c.name;$('cphone').value=c.phone;$('cdate').value=c.date;$('cdisc').value=c.disc;$('cnote').value=c.note}
function upd(rerenderCart,keepFocus){
 if(!rerenderCart||true){if(document.activeElement&&['cname','cphone','cdate','cdisc','cnote'].includes(document.activeElement.id)){S.view=null}}
 readCust();
 if(rerenderCart)renderCart();
 $('gt').textContent=fmt(Math.max(0,sub(S.cart)-S.cust.disc))+' '+CUR;
 renderReceipt();save()
}

/* receipt */
function currentData(){
 if(S.view)return S.view;
 return{no:S.counter,date:S.cust.date,name:S.cust.name,phone:S.cust.phone,items:S.cart,disc:S.cust.disc,note:S.cust.note}
}
function receiptHTML(d){
 const s=sub(d.items),t=Math.max(0,s-(d.disc||0));
 return `<div class="c"><svg class="logo" viewBox="0 0 200 110"><use href="#car"/></svg><h1>${TITLE}</h1><div>وصل بيع</div></div><hr>
 <div class="sum"><span>رقم الوصل: <b>${d.no}</b></span><span>${esc(d.date)}</span></div>
 ${d.name?`<div>الزبون: <b>${esc(d.name)}</b></div>`:''}${d.phone?`<div>الهاتف: <b dir="ltr">${esc(d.phone)}</b></div>`:''}<hr>
 <table><tr><th>المادة</th><th>العدد</th><th class="n">المبلغ</th></tr>
 ${d.items.map(i=>`<tr><td>${esc(i.name)}<br><small>${fmt(i.price)}</small></td><td>${i.qty}</td><td class="n">${fmt(i.price*i.qty)}</td></tr>`).join('')||'<tr><td colspan="3" class="c">—</td></tr>'}</table><hr>
 <div class="sum"><span>المجموع</span><span>${fmt(s)}</span></div>
 ${d.disc?`<div class="sum"><span>الخصم</span><span>${fmt(d.disc)}</span></div>`:''}
 <div class="sum grand"><span>الصافي</span><span>${fmt(t)} ${CUR}</span></div>
 ${d.note?`<hr><div>ملاحظة: ${esc(d.note)}</div>`:''}<hr><div class="c">شكراً لتعاملكم معنا</div>`
}
function renderReceipt(){const r=$('receipt');r.className=S.set.paper==='80'?'p80':'';r.innerHTML=receiptHTML(currentData())}
function printNow(){
 const d=currentData();if(!d.items.length)return toast('السلة فارغة');
 const z=$('printzone');z.innerHTML=`<div id="receipt" class="${S.set.paper==='80'?'p80':''}">${receiptHTML(d)}</div>`;
 const old=$('receipt');old.removeAttribute('id');
 window.print();
 setTimeout(()=>{z.innerHTML='';old.id='receipt'},300)
}

/* orders */
function saveOrder(msg){
 if(!S.cart.length){toast('السلة فارغة');return null}
 readCust();
 const o={no:S.counter,date:S.cust.date,name:S.cust.name,phone:S.cust.phone,items:JSON.parse(JSON.stringify(S.cart)),disc:S.cust.disc,note:S.cust.note,total:Math.max(0,sub(S.cart)-S.cust.disc),savedAt:new Date().toISOString()};
 S.history.unshift(o);S.counter++;save();renderHist();
 if(msg){toast('تم حفظ الطلب رقم '+o.no);newOrder(true)}
 return o
}
function saveAndPrint(){const o=saveOrder(false);if(!o)return;S.view=o;renderReceipt();printNow();setTimeout(()=>newOrder(true),500)}
function newOrder(quiet){S.cart=[];S.cust={name:'',phone:'',date:today(),disc:0,note:''};S.view=null;writeCust();renderCart();upd();if(!quiet)toast('طلب جديد')}
function renderHist(){
 const q=$('hq').value.trim().toLowerCase();
 const list=S.history.map((o,i)=>({o,i})).filter(({o})=>!q||(o.name||'').toLowerCase().includes(q)||(o.phone||'').includes(q)||String(o.no)===q);
 $('hist').innerHTML=list.length?list.map(({o,i})=>`<div class="h-item"><div><b>#${o.no}</b> ${esc(o.name)||'بدون اسم'}<small>${esc(o.date)} ${o.phone?'· '+esc(o.phone):''} · ${fmt(o.total)} ${CUR}</small></div><div><button onclick="viewHist(${i})">عرض</button><button class="alt" onclick="editHist(${i})">تعديل</button><button class="danger" onclick="delHist(${i})">×</button></div></div>`).join(''):'<div class="empty">لا توجد طلبات محفوظة بعد.</div>'
}
function viewHist(i){S.view=S.history[i];renderReceipt();toast('معروض الآن في المعاينة، اضغط طباعة لإعادة الطباعة')}
function editHist(i){const o=S.history[i];S.cart=JSON.parse(JSON.stringify(o.items));S.cust={name:o.name,phone:o.phone,date:o.date,disc:o.disc,note:o.note};S.view=null;writeCust();renderCart();upd();toast('تم تحميل الطلب للتعديل، سيُحفظ كطلب جديد')}
function delHist(i){if(confirm('حذف هذا الطلب من السجل؟')){S.history.splice(i,1);save();renderHist();S.view=null;renderReceipt()}}

/* backup */
function exportJSON(){
 const{view,...rest}=S;
 const blob=new Blob([JSON.stringify({app:'zargani-receipt',version:1,exportedAt:new Date().toISOString(),data:rest},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zargani-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('تم تصدير النسخة الاحتياطية')
}
function importJSON(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const j=JSON.parse(r.result),d=j.data||j;
  if(!Array.isArray(d.history)&&!Array.isArray(d.products))throw 0;
  const replace=confirm('موافق = استبدال كل البيانات الحالية\nإلغاء = دمج النسخة مع البيانات الحالية');
  if(replace){S={...S,...d,set:{...S.set,...(d.set||{})},view:null}}
  else{
   (d.products||[]).forEach(p=>{if(!S.products.find(x=>x.name===p.name))S.products.push(p)});
   (d.history||[]).forEach(o=>{if(!S.history.find(x=>x.savedAt===o.savedAt&&x.no===o.no))S.history.push(o)});
   S.history.sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
   S.counter=Math.max(S.counter,d.counter||1)
  }
  save();init();toast('تم استيراد النسخة الاحتياطية')
 }catch(e){toast('ملف النسخة الاحتياطية غير صالح')}inp.value=''};
 r.readAsText(f)
}

function init(){applySet();renderProducts();writeCust();renderCart();renderHist();$('gt').textContent=fmt(Math.max(0,sub(S.cart)-S.cust.disc))+' '+CUR;renderReceipt()}
load();
try{if(sessionStorage.getItem('zl')==='1')enter();else $('pw').focus()}catch(e){$('pw').focus()}
</script>
</body>
</html>
